<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Jimi Firgo Dakhi</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-black text-white">

  <!-- Navbar -->
  <header class="fixed top-0 left-0 w-full z-50 backdrop-blur-md bg-black/60 border-b border-white/10">
    <nav class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="text-xl font-bold text-white">Jimi.</a>
      <ul class="hidden md:flex space-x-8 text-gray-300">
        <li><a href="index.html" class="hover:text-white transition-colors">Home</a></li>
        <li><a href="index.html#projects" class="hover:text-white transition-colors">Projects</a></li>
        <li><a href="dashboard.html" class="text-purple-400 transition-colors">Dashboard</a></li>
      </ul>
      <a href="index.html" class="px-5 py-2 bg-gradient-to-r from-purple-500 to-blue-500 text-white rounded-lg text-sm font-medium hover:scale-105 transition-all duration-300">
        Back to Portfolio
      </a>
    </nav>
  </header>

  <!-- Dashboard Hero -->
  <section class="pt-32 pb-12 bg-black">
    <div class="max-w-6xl mx-auto px-6 text-center">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Project <span class="text-purple-400">Dashboard</span></h1>
      <p class="text-gray-400 max-w-2xl mx-auto mb-8">
        Overview effort, kontribusi, dan aktivitas per proyek dalam bentuk visual interaktif.
      </p>
      <button id="refreshDashboard" class="px-6 py-3 bg-gradient-to-r from-purple-500 to-blue-500 text-white rounded-lg font-medium hover:scale-105 transition-all duration-300">
        Refresh Data
      </button>
    </div>
  </section>

  <!-- Dashboard Charts -->
  <section class="pb-20 bg-black">
    <div class="max-w-6xl mx-auto px-6">
      <div class="grid md:grid-cols-2 gap-8">

        <!-- Stacked Bar -->
        <div class="bg-gray-900/50 border border-gray-800 rounded-xl p-6">
          <h2 class="text-white font-semibold text-center mb-4">Project Effort (Stacked Bar)</h2>
          <div class="chart-container-wide">
            <canvas id="stackedBarChart"></canvas>
          </div>
        </div>

        <!-- Radar -->
        <div class="bg-gray-900/50 border border-gray-800 rounded-xl p-6">
          <h2 class="text-white font-semibold text-center mb-4">Total Effort per Project (Polar Area)</h2>
          <div class="chart-container-wide">
            <canvas id="polarChart"></canvas>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="py-8 bg-black border-t border-gray-800">
    <div class="footer-layout max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <p class="text-gray-500 text-sm">&copy; 2026 Jimi Firgo Dakhi. All rights reserved.</p>
      <div class="flex gap-6">
        <a href="https://github.com/dachi01-afk" class="text-gray-500 hover:text-purple-400 transition-colors text-lg">GitHub</a>
        <a href="https://www.linkedin.com/in/jimy-firgo-dakh" class="text-gray-500 hover:text-purple-400 transition-colors text-lg">LinkedIn</a>
      </div>
    </div>
  </footer>

  <script src="dashboard.js"></script>
</body>
</html>
